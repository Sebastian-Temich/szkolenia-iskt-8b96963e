# CI projektu: jakość kodu na każdym PR i pushu na main (ADR-002, W-01, W-06).
# Checki `jakosc` i `e2e` commita z main są Vercel Deployment Checks produkcji (ADR-006 pkt 2, #71).
# Runner: zmienna repo SH_RUNS_ON (repo prywatne: runner serwera); bez niej ubuntu-24.04 GitHuba,
# tak samo jak w sh.yml. Wersja pnpm z pola packageManager w package.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jakosc:
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Instalacja
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typy
        run: pnpm typecheck
      - name: Testy
        run: pnpm test
      - name: Build
        run: pnpm build

  # Czy zmiana dotyka supabase/ (W-06/K1). Bez akcji zewnętrznych: git diff względem bazy PR albo
  # poprzedniego stanu main; workflow_dispatch i brak punktu odniesienia uruchamiają job baza zawsze.
  zmiany:
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    outputs:
      supabase: ${{ steps.filtr.outputs.supabase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Zmiany w supabase/
        id: filtr
        env:
          ZDARZENIE: ${{ github.event_name }}
          BAZA_PR: ${{ github.event.pull_request.base.sha }}
          PRZED: ${{ github.event.before }}
        run: |
          if [ "$ZDARZENIE" = "pull_request" ]; then od="$BAZA_PR"; else od="$PRZED"; fi
          if [ "$ZDARZENIE" = "workflow_dispatch" ] || [ -z "$od" ] \
            || ! git cat-file -e "${od}^{commit}" 2>/dev/null; then
            wynik=true
          elif [ -n "$(git diff --name-only "$od" HEAD -- supabase/)" ]; then
            wynik=true
          else
            wynik=false
          fi
          echo "supabase=$wynik" >> "$GITHUB_OUTPUT"
          echo "Zmiany w supabase/: $wynik"

  # Baza z repo na czystej instancji (ADR-001, W-02, W-05, W-06): migracje i seed, pgTAP, lint i
  # advisors. Wersja CLI = wersja na serwerze (plan.md, „Ryzyka”); zmiana razem z serwerem.
  baza:
    needs: zmiany
    if: needs.zmiany.outputs.supabase == 'true'
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - name: Start (migracje i seed na czystej bazie)
        run: supabase start
      # Skrypty wdrożenia produkcji (ADR-005 pkt 7, W-15–W-17, issue #61) na bazie z migracji BEZ
      # seeda: seed.sql ma trenerów, przypisania i konta testowe, a produkcja ich nie ma. Skrypty idą
      # przez psql -f jak w SQL Editor; potem zwykły reset z seedem i pgTAP.
      - name: Reset bazy bez seeda (skrypty produkcji)
        run: supabase db reset --local --no-seed
      - name: Klient psql
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Skrypty produkcji (supabase/produkcja)
        run: |
          DB_URL="$(supabase status -o json | jq -r '.DB_URL')"
          if [ -z "$DB_URL" ] || [ "$DB_URL" = "null" ]; then
            echo "Brak DB_URL w supabase status" >&2
            exit 1
          fi
          export DB_URL
          bash supabase/produkcja/ci/test-skryptow.sh
      - name: Reset bazy (migracje i seed od zera)
        run: supabase db reset --local
      - name: Testy pgTAP
        run: supabase test db --local
      - name: Lint bazy
        run: supabase db lint --local --fail-on error
      - name: Advisors
        run: supabase db advisors --local --fail-on error
      - name: Stop
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup

  # Testy skryptów i workflow wdrożenia (issue #71): Ignored Build Step Vercel i migracje produkcji.
  # Tylko pliki projektu, nie cały scripts/tests (testy szablonu czytają docs/ szablonu).
  skrypty:
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Narzędzia (bats, yq)
        run: |
          if ! command -v bats >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bats
          fi
          command -v yq >/dev/null 2>&1 || { echo "::error title=Brak yq::Runner bez yq (mikefarah)."; exit 1; }
          bats --version
          yq --version
      - name: Testy bats wdrożenia
        run: bats scripts/tests/vercel-pomin-build.bats scripts/tests/wdrozenie-vercel.bats

  # E2E na PR, pushu do main i ręcznie (AGENTS.md „Testy E2E”, issue #20, #71): lokalny Supabase z
  # migracji i seed jak w jobie baza, serwis z `pnpm dev` (webServer Playwrighta), chromium i webkit
  # headless. Zmienne bazy to lokalne klucze demo z `supabase status`, bez sekretów repo.
  # Na pushu do main e2e jest checkiem dla Vercel Deployment Checks (jakosc i e2e, ADR-006 pkt 2):
  # wdrożenie produkcji czeka na oba checki commita z main.
  e2e:
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - name: Instalacja
        run: pnpm install --frozen-lockfile
      - name: Przeglądarki Playwright (chromium, webkit)
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Start bazy (migracje i seed na czystej bazie)
        run: supabase start
      - name: Reset bazy (migracje i seed od zera)
        run: supabase db reset --local
      - name: Zmienne bazy lokalnej dla serwisu
        run: |
          status="$(supabase status -o json)"
          url="$(jq -r '.API_URL' <<<"$status")"
          klucz="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<<"$status")"
          if [ -z "$url" ] || [ "$url" = "null" ] || [ -z "$klucz" ] || [ "$klucz" = "null" ]; then
            echo "Brak API_URL albo klucza publicznego w supabase status" >&2
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$url"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$klucz"
          } >> "$GITHUB_ENV"
      - name: Testy E2E (chromium, webkit)
        run: pnpm exec playwright test --project=chromium --project=webkit
      - name: Raport Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      # Zrzuty pełnych stron z e2e/responsywnosc.spec.ts (chromium, issue #37) do obejrzenia
      # przez właściciela; tylko artefakt CI, nie trafiają do repo.
      - name: Zrzuty responsywności
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: responsywnosc-zrzuty
          path: test-results/responsywnosc-zrzuty/
          retention-days: 14
          if-no-files-found: warn
      - name: Stop bazy
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
