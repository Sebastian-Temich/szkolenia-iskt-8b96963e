# Migracje bazy produkcyjnej po zatwierdzeniu właściciela (ADR-006 pkt 6, W-21, Z4, issue #71).
# Job czeka na zatwierdzenie w środowisku GitHub `production` (wymagany reviewer: właściciel,
# Deployment branches: tylko main). Sekrety SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD i
# SUPABASE_PROJECT_ID są wyłącznie w tym środowisku, nie w sekretach repo.
# Runner GitHuba (ubuntu-24.04), nie SH_RUNS_ON: poświadczenia produkcji nie trafiają na serwer agentów.
# Migracje są zgodne wstecz (ADR-006 pkt 3): aplikacja z main działa na schemacie sprzed migracji.
# Instrukcja: docs/wydanie/techniczna/produkcja-vercel.md.

name: Migracje produkcji

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  # Ręcznie domyślnie tylko podgląd (test z instrukcji, krok 11); wykonanie po odznaczeniu pola.
  workflow_dispatch:
    inputs:
      tylko_podglad:
        description: "Tylko podgląd (supabase db push --dry-run), bez wykonania migracji"
        type: boolean
        default: true

permissions:
  contents: read

# Jedna kolejka dla bazy produkcyjnej; trwająca migracja nigdy nie jest anulowana.
concurrency:
  group: migracje-produkcja
  cancel-in-progress: false

jobs:
  migracje:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Sekrety środowiska production
        run: |
          brak=""
          for nazwa in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!nazwa}" ]; then brak="$brak $nazwa"; fi
          done
          if [ -n "$brak" ]; then
            echo "::error title=Brak sekretów::W środowisku production brakuje:$brak (instrukcja produkcja-vercel.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - name: Połączenie z projektem produkcji
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Podgląd migracji (dry run)
        run: supabase db push --dry-run
      - name: Migracje produkcji
        if: github.event_name == 'push' || inputs.tylko_podglad == false
        run: supabase db push --yes
