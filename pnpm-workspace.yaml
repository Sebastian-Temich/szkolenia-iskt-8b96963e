# Ustawienia pnpm projektu (ADR-002, przejście z bun: odpowiednik bunfig.toml).
# Ochrona łańcucha dostaw: pomijaj wersje opublikowane mniej niż dobę temu (minuty).
minimumReleaseAge: 1440
# Każdy wyjątek omija ochronę dla jednej paczki; te same paczki co w bunfig.toml z Lovable.
minimumReleaseAgeExclude:
  - "@lovable.dev/vite-tanstack-config"
  - "@lovable.dev/mcp-js"
  - "@lovable.dev/ai-gateway"
  - "@lovable.dev/email-js"
  - "@lovable.dev/webhooks-js"
# Skrypty budowania zależności tylko z tej listy. Pusta: przy instalacji pnpm nie pyta o żadną
# paczkę (vite 8 i rolldown dostarczają binarki jako paczki opcjonalne, bez postinstall).
allowBuilds: {}
# Dawne "overrides" z package.json (bun/npm). pnpm 12 nie czyta pola "pnpm" w package.json,
# więc pnpm.overrides mieszka tutaj.
overrides:
  # Jedna wersja rolldown dla vite i nitro; zakres zgodny z vite 8.3.x (~1.2.18).
  rolldown: 1.2.19
  # typescript-eslint 8.72.2 (najnowszy) wymaga minimatch ^10.2.2, a 10.x ma GHSA-g3hv-75wg-m249
  # (poprawka od 11.0.1). API bez zmian; usuń, gdy typescript-eslint podniesie zależność.
  "@typescript-eslint/typescript-estree>minimatch": ^11.0.8
