  - id: T15
    tytul: Workflow migracji produkcji, Ignored Build Step i instrukcja wdrożenia na Vercel
    cel: >-
      Właściciel uruchamia produkcję na Vercel według instrukcji krok po kroku, migracje wdrażają
      się po jego zatwierdzeniu, a zmiany samej dokumentacji nie wdrażają produkcji (W-18, W-20,
      W-21, W-22). Decyzja: ADR-006 pkt 2, 4, 5, 6, 7. Pliki: .github/workflows/migracje-produkcja.yml
      (push na main ze zmianą supabase/migrations/** i workflow_dispatch; environment production;
      sekrety SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID tylko w środowisku;
      supabase link, db push --dry-run, db push; permissions contents: read; concurrency bez
      anulowania; bez pull_request_target); scripts/vercel-pomin-build.sh (wyjście 0 = pomiń build
      Vercel, gdy commit zmienia tylko docs/, CHANGELOG.md i inne pliki spoza aplikacji; lista w
      skrypcie; test bats w scripts/tests/); CI: e2e uruchamia się także na pushu do main albo
      Deployment Checks wymagają tylko jakosc — wybór z uzasadnieniem w raporcie i instrukcji
      (backlog review PR #68). Instrukcja docs/wydanie/techniczna/produkcja-vercel.md: kroki
      właściciela w kolejności ADR-006 pkt 7 (odłączenie synchronizacji Lovable, ustawienia projektu
      Vercel: framework, Ignored Build Step ze skryptem zamiast exit 0, region fra1, zmienne
      Production i Preview z listą nazw, Deployment Checks, Deployment Protection, sprawdzenie
      *.vercel.app, nowy klucz Resend, środowisko GitHub production z wymaganym reviewerem i
      sekretami, test workflow przez workflow_dispatch, domena w Vercel i CNAME w seohost, rollback
      aplikacji przez Promote i rollback DNS), każdy krok z oczekiwanym wynikiem i ścieżką przy
      błędzie; bez wartości sekretów. Poza zakresem: konfiguracja builda (T14), wykonanie kroków.
    kryteria:
      - "W-21: migracje-produkcja.yml ma wyzwalacze push (paths supabase/migrations/**) i workflow_dispatch, environment production, concurrency bez cancel-in-progress, permissions contents: read, bez pull_request_target; sekrety tylko przez secrets.* w jobie środowiska (przegląd pliku, actionlint albo test workflow w CI zielony)"
      - "W-18: scripts/vercel-pomin-build.sh zwraca 0 dla commita zmieniającego tylko docs/ albo CHANGELOG.md i 1 dla commita ze zmianą w src/, package.json, vite.config.ts lub supabase/ (test bats w scripts/tests/ w CI)"
      - "Decyzja o e2e na pushu do main albo Deployment Checks tylko z jakosc zapisana w raporcie i instrukcji; CI zgodne z tą decyzją"
      - "Instrukcja docs/wydanie/techniczna/produkcja-vercel.md zawiera wszystkie kroki ADR-006 pkt 7 w kolejności, z poleceniami lub ścieżkami w panelach, oczekiwanym wynikiem i rollbackiem (przegląd pliku); gitleaks i bash scripts/check-dod.sh przechodzą"
    pliki: [.github/workflows/migracje-produkcja.yml, .github/workflows/ci.yml, scripts/vercel-pomin-build.sh, scripts/tests/, docs/wydanie/techniczna/produkcja-vercel.md]
    testy: bats scripts/tests
    zaleznosci: [T14]
    milestone: M5 Produkcja na Vercel
    typ: feature
    kategoria: ci
    stack: [supabase]
    db_migracja: false

