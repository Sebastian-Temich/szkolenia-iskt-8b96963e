  - id: T10
    tytul: Polityka prywatności i informacja o danych przy formularzu
    cel: >-
      Osoba wysyłająca zgłoszenie wie, kto i po co przetwarza jej dane: informacja pod zgodą,
      odnośnik do nowej strony /polityka-prywatnosci i odnośnik w stopce (W-13). Karta:
      docs/00-intake/funkcje/W-13.md, kryteria W-13/K1–K3 (K4 to akceptacja treści przez
      właściciela, już udzielona 2026-11-15). Treść: docs/00-intake/zrodla/polityka-prywatnosci.md
      (szkic zaakceptowany), w osobnym module treści; pola danych firmy (adres siedziby, KRS, NIP)
      właściciel poda później: zostaw je jako widoczne pola „[do uzupełnienia]” w jednym miejscu
      modułu treści i zapisz to w raporcie. Design: brak makiety, prosta strona tekstowa w systemie
      marki (kontener strony, Eyebrow jak sekcje strony głównej). Poza zakresem: regulamin, baner
      cookie, logika wysyłki (T9).
    kryteria:
      - "Podpięcie: trasa /polityka-prywatnosci w routingu; W-13/K1: e2e z / klika „Polityka prywatności” w stopce i widzi nagłówek „Polityka prywatności” z treścią szkicu, w chromium i webkit"
      - "W-13/K2: w formularzu sekcji kontaktu i okna zapisu pod zgodą jest informacja o administratorze, a „polityką prywatności” to odnośnik do /polityka-prywatnosci; w oknie otwiera nową kartę (test jednostkowy)"
      - "W-13/K3: /polityka-prywatnosci przy 360 px bez poziomego przewijania i bez naruszeń axe serious/critical (e2e/responsywnosc.spec.ts i e2e/dostepnosc.spec.ts)"
      - "Treść polityki tylko w module treści (bez tekstu w komponencie), z datą aktualizacji; pnpm lint, pnpm typecheck, pnpm test bez błędów; job e2e zielony"
