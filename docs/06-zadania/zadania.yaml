# Specyfikacja: docs/00-intake/specyfikacja.md (cykl M5), W-18…W-22. ID kontynuują numerację projektu (M4: T12–T13).
zadania:
  - id: T14
    tytul: Build na Vercel bez konfiguracji Lovable
    cel: >-
      Strona buduje się i działa na Vercel w regionie fra1 bez @lovable.dev/vite-tanstack-config
      (W-18, W-19). Decyzja: docs/04-plan/adr/ADR-006-produkcja-vercel.md pkt 1, 3, 4.
      vite.config.ts z defineConfig z vite: tanstackStart (server.entry "server"), nitro z presetem
      vercel i regionem fra1, @vitejs/plugin-react, @tailwindcss/vite, resolve.tsconfigPaths: true
      (bez vite-tsconfig-paths), alias @, wtyczka naprawy komentarza w src/styles.css bez zmian,
      devtools tylko w dev, pnpm dev na porcie 8080 (playwright i README tego używają). Usuń
      @lovable.dev/vite-tanstack-config i vite-tsconfig-paths z zależności; dodaj brakujące paczki
      jawnie (dokładne wersje zgodne z obecnym lockfile, jeśli były przechodnie). Zmienne VITE_* i
      serwerowe (ADR-004) działają jak dziś. Test serwera: przy ZGLOSZENIA_NAGLOWEK_IP=x-vercel-forwarded-for
      adres do limitu pochodzi z tego nagłówka, a zmieniany x-forwarded-for nie zeruje limitu
      (O-37b). Zaktualizuj sekcję „Lovable” w AGENTS.md (build bez Lovable, synchronizacja do
      odłączenia przez właściciela, ADR-006) i README (uruchomienie, build). Poza zakresem:
      workflow migracji, Ignored Build Step, instrukcja Vercel (T15), zmiany funkcji aplikacji.
    kryteria:
      - "W-18: pnpm build tworzy wyjście Vercel (.vercel/output z funkcją w regionie fra1) bez @lovable.dev/vite-tanstack-config i vite-tsconfig-paths w package.json i lockfile (przegląd i wynik builda w raporcie)"
      - "pnpm dev serwuje aplikację na porcie 8080 z tymi samymi stronami; pnpm lint, pnpm typecheck i pnpm test bez błędów; job e2e (chromium, webkit) zielony na PR"
      - "W-19 / O-37b: test serwera (vitest) potwierdza adres z x-vercel-forwarded-for przy ZGLOSZENIA_NAGLOWEK_IP=x-vercel-forwarded-for i brak wpływu zmienianego x-forwarded-for na limit"
      - "Wtyczka naprawy komentarza w styles.css działa (src/styles.css bez zmian, build bez błędu CSS); AGENTS.md (sekcja Lovable, Stack) i README opisują build bez Lovable"
    pliki: [vite.config.ts, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, tsconfig.json, src/server.ts, src/lib/zgloszenia/, src/test/, AGENTS.md, README.md, playwright.config.ts, .gitignore]
    testy: pnpm test
    zaleznosci: []
    milestone: M5 Produkcja na Vercel
