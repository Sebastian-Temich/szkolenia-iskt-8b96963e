      produkcji (.env.production.local, poza repo), co zrobić przy niezgodności schematu, rollback.
      Bez sekretów, haseł i prawdziwych e-maili w repo. Agenci nie łączą się z produkcją.
      Poza zakresem: wykonanie na produkcji (właściciel), migracje i config.toml (bez zmian),
      Vercel, automatyczne wdrażanie z CI.
