zadania:
  - id: T9
    tytul: Wysyłka zgłoszenia z formularza przez Resend
    cel: >-
      Osoba zainteresowana szkoleniem wysyła zgłoszenie z formularza na stronie głównej, w oknie
      „Zapisz się na szkolenie”, „Zapytaj o termin dla firmy” i z profilu trenera, a biuro dostaje
      e-mail ze wszystkimi danymi (W-12, W-14). Karta: docs/00-intake/funkcje/W-12.md, kryteria
      W-12/K1–K9 (K10 to test ręczny właściciela, scenariusz O-17). Decyzja i dowody:
      docs/04-plan/adr/ADR-004-wysylka-zgloszen-resend-i-dane-osobowe.md (funkcja serwerowa
      createServerFn w src/lib/zgloszenia/, Resend przez fetch z limitem 10 s, zmienne serwerowe bez
      VITE_, pułapka, limit 5/10 min z adresu połączenia albo nagłówka platformy, nigdy z
      x-forwarded-for, limit globalny 50/h, logi z białą listą, konfiguracja jako parametr handlera).
      Rozważ też limit dobowy 80 wysyłek (backlog review PR #44) i zapisz decyzję w raporcie.
      Design: istniejący formularz w src/components/strona-glowna/SekcjaKontakt.tsx i
      src/components/szkolenia/OknoZapisu.tsx; stany wysyłki brak w designie, teksty w karcie W-12,
      wygląd z tokenów src/styles.css (bez zmian pliku). Nie wysyłasz prawdziwych e-maili: testy z
      atrapą fetch i page.route; .env.local z kluczem nie jest do odczytu. Poza zakresem: polityka
      prywatności i odnośniki (T10), zapis w bazie, e-mail do zgłaszającego, CAPTCHA, zmiany w supabase/.
    kryteria:
      - "Podpięcie: formularz wysyła przez funkcję serwerową wyslijZgloszenie z /#kontakt, z okna na /szkolenia/$id (oba warianty) i z okna na /trenerzy/$id; napis „Formularz zostanie podłączony w kolejnym etapie.” usunięty; W-12/K8: e2e przechwytuje żądanie (page.route) i sprawdza zrodlo kontakt, zapis, firma, firma oraz „Dziękujemy!” w chromium i webkit"
      - "W-12/K1, W-12/K7: test serwera z atrapą fetch: jedno wywołanie Resend z from, to z konfiguracji, reply_to = e-mail zgłaszającego, tematem R4 i treścią ze wszystkimi polami; HTML i emoji escapowane, temat bez nowej linii"
      - "W-12/K2, W-12/K6: puste albo błędne pole daje komunikat przy polu z karty, fokus na pierwszym błędnym polu, brak wywołania funkcji; w trakcie wysyłki przycisk „Wysyłam…” zablokowany i jedno wywołanie (testy jednostkowe i e2e)"
      - "W-12/K3, W-12/K4, W-12/K5: test serwera: błąd Resend, przekroczenie 10 s i brak konfiguracji dają stan błędu z szkolenia@iskt.pl i dane zostają w polach; wypełniona pułapka daje sukces bez wywołania; szóste zgłoszenie w 10 min (także ze zmienianym x-forwarded-for) i 51. wysyłka w godzinie dają „Za dużo prób”"
      - "W-12/K9, W-14: test serwera sprawdza, że wywołania loggera dla sukcesu, błędu i odrzucenia nie zawierają imienia, e-maila, telefonu ani treści; brak zapisu do bazy (żadnego wywołania klienta Supabase w module)"
      - "Zmienne RESEND_API_KEY, ZGLOSZENIA_ODBIORCA, ZGLOSZENIA_NADAWCA, ZGLOSZENIA_NAGLOWEK_IP w .env.example bez wartości i opisane w README (uruchomienie lokalne); pnpm lint, pnpm typecheck, pnpm test i pnpm build przechodzą; job e2e zielony; axe bez serious/critical przy stanach formularza"
    pliki: [src/lib/zgloszenia/, src/components/strona-glowna/SekcjaKontakt.tsx, src/components/strona-glowna/tresci.ts, src/components/szkolenia/OknoZapisu.tsx, src/components/trenerzy/ProfilTrenera.tsx, src/test/, e2e/, .env.example, README.md, package.json, pnpm-lock.yaml]
